plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Phase 3 (M2): the phone carries the TV app it was built with, so it can install or update tv-hero on
// the TV over the home network. Same release key as the TV app; versions always match.
evaluationDependsOn(':tv-launcher')
def tvApkDir = layout.buildDirectory.dir('generated/tvApk')
def tvLauncher = project(':tv-launcher')
def bundleTvApk = tasks.register('bundleTvApk') {
    dependsOn ':tv-launcher:assembleRelease'
    def apk = tvLauncher.layout.buildDirectory.file('outputs/apk/release/tv-launcher-release.apk')
    def outDir = tvApkDir.map { it.dir('assets') }
    def code = tvLauncher.android.defaultConfig.versionCode
    def name = tvLauncher.android.defaultConfig.versionName
    inputs.file(apk)
    inputs.property('code', code)
    inputs.property('name', name)
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        java.nio.file.Files.copy(apk.get().asFile.toPath(), new File(dir, 'tv-hero-tv.apk').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        new File(dir, 'tv-hero-tv.properties').text = "versionCode=${code}\nversionName=${name}\n"
    }
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.ajit.tvhero.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ajit.tvhero.remote'
        // 28: Bluetooth HID device profile (remote and game controller) arrived in Android 9.
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName '2.8.0'
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    sourceSets { main { assets { srcDir tvApkDir.map { it.dir('assets') } } } }
    androidResources { noCompress 'apk' }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Screenshots of every screen: ./gradlew testDebugUnitTest -Pscreenshots=record (writes docs/screenshots/phone/)
                // Screenshot tests need Robolectric's Android download: only with -Pscreenshots=record.
                if (project.findProperty('screenshots') != 'record') exclude '**/ScreenshotTest*'
                systemProperty 'screenshots', project.findProperty('screenshots') ?: 'off'
                systemProperty 'roborazzi.test.record', project.findProperty('screenshots') == 'record' ? 'true' : 'false'
                systemProperty 'screenshotDir', rootProject.file('docs/screenshots/phone').absolutePath
            }
        }
    }
}

dependencies {
    implementation project(':protocol')
    implementation project(':adb')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.26.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.26.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

tasks.named('preBuild') { dependsOn bundleTvApk }
