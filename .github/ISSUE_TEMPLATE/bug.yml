name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to see it }
  - type: input
    id: versions
    attributes: { label: Versions, description: "Phone app and TV app (Settings → About), TV model and Android version" }
  - type: markdown
    attributes: { value: "Security problems: please use **Report a vulnerability** on the Security tab instead of an issue." }
