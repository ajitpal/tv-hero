name: Website

# Republishes https://ajitpal.github.io/tv-hero/ when its pages change on main, between releases.
# One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'brand/**', 'CHANGELOG.md', 'docs/screenshots/**', 'tools/build_site.py' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check
        run: |
          pip install markdown==3.7
          python3 tools/build_site.py _site
          python3 tools/check_public.py _site
      - name: Keep the latest update.json on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern update.json --dir _site 2>/dev/null || echo "no release yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
